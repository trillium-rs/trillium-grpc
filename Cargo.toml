[workspace]
members = [".", "codegen", "macros", "conformance"]

[package]
name = "trillium-grpc"
version = "0.2.0"
edition = "2024"
description = "gRPC server and client for trillium, built on trillium-http's h2/h2c/h3 support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trillium-rs/trillium-grpc"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["gzip"]
json = ["dep:serde", "dep:serde_json"]
gzip = ["dep:flate2"]
deflate = ["dep:flate2"]
zstd = ["dep:zstd"]
codegen = ["dep:trillium-grpc-codegen"]
macros = ["dep:trillium-grpc-macros"]

[[test]]
name = "codegen"
required-features = ["codegen"]

[[test]]
name = "macros"
required-features = ["macros"]

[[example]]
name = "greeter"
required-features = ["macros"]

[dependencies]
trillium = "1.2.0"
trillium-http = "1.3.0"
trillium-client = "0.9"
trillium-server-common = "0.7"
prost = "0.14"
bytes = "1"
futures-lite = "2"
thiserror = "2"
pin-project-lite = "0.2"
async-channel = "2"
sync_wrapper = "1"
base64 = "0.22"
log = "0.4"

serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }

trillium-grpc-codegen = { version = "0.2", path = "codegen", optional = true }
trillium-grpc-macros = { version = "0.2", path = "macros", optional = true }

[dev-dependencies]
futures-lite = "2"
trillium-tokio = "0.6.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["gzip"] }
tonic-prost = "0.14"


# Only used to regenerate the checked-in tonic fixture (tests/proto/gen/). Not a
# build-dependency, so consumers of this crate never compile it.
tonic-prost-build = "0.14"
env_logger = "0.11"


