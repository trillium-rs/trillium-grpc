[package]
name = "trillium-grpc-conformance"
version = "0.0.0"
edition = "2024"
description = "Connect/gRPC conformance harness for trillium-grpc (never published)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "conformance-server"
path = "src/bin/server.rs"

[[bin]]
name = "conformance-client"
path = "src/bin/client.rs"

[dependencies]
trillium-grpc = { path = "..", default-features = false, features = ["gzip"] }
trillium = "1.2.0"
trillium-client = "0.9"
trillium-tokio = "0.6.1"
trillium-rustls = "0.11"
rustls-pemfile = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "time", "sync"] }
prost = "0.14"
prost-types = "0.14"
bytes = "1"
base64 = "0.22"
futures-lite = "2"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
trillium-grpc-codegen = { path = "../codegen" }
