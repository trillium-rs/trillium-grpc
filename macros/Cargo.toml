[package]
name = "trillium-grpc-macros"
version = "0.1.0"
edition = "2024"
description = "Proc-macro entry point for trillium-grpc compile-time codegen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbr/trillium-grpc"

[lib]
proc-macro = true

[dependencies]
trillium-grpc-codegen = { version = "0.1", path = "../codegen" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
